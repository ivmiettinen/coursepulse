<div class="filter-bar" role="group" aria-label="Feedback filters and sorting">
  <form [formGroup]="filters" (ngSubmit)="submitSearch()" aria-label="Search feedback comments">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Search comments</mat-label>
      <input matInput type="search" formControlName="search" maxlength="200" />
      <mat-hint>Apply with Search or Enter</mat-hint>
    </mat-form-field>
    <button mat-flat-button type="submit">Search</button>
  </form>
  <div class="filter-options">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Rating</mat-label>
      <mat-select [formControl]="filters.controls.rating" [canSelectNullableOptions]="true">
        <mat-option [value]="null">All ratings</mat-option>
        @for (rating of ratings; track rating) {
          <mat-option [value]="rating">{{ rating }} / 5</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Sort by</mat-label>
      <mat-select [formControl]="sort">
        @for (option of sorts; track option) {
          <mat-option [value]="option">{{ sortLabels[option] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div><button mat-button type="button" (click)="clearFilters()">Clear filters</button></div>
</div>
