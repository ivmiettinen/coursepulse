services:
  postgres:
    image: postgres:17
    container_name: coursepulse-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - coursepulse-postgres-data:/var/lib/postgresql/data

volumes:
  coursepulse-postgres-data: